name: Build and release

on:
    push:
        branches: [ "main" ]

    # workflow_dispatch:

permissions:
  contents: write

jobs:
  # Gate the build on the suite; a red test must not ship a release.
  test:
    uses: ./.github/workflows/test.yaml

  build:
    needs: test

    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: "Compile with pyinstaller"
        run: |
          pyinstaller build.spec

      - name: "Publish beta release"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete beta --yes --cleanup-tag || echo "no existing beta release"
          gh release create beta --prerelease --title "Beta release" --target main --notes "feature-complete-ish, but still being tested.`n`nAutomated build from ${{ github.sha }}" LICENSE.TXT (Get-Item *.zip)
        shell: pwsh
