name: Tests

on:
    # No `push:` trigger: it duplicated every same-repo PR run, and pushes to
    # main/test already reach this through the build workflows below.
    pull_request:
    workflow_dispatch:
    # Lets the build workflows gate their Windows build on this.
    workflow_call:

concurrency:
    # github.workflow is the *caller's* name in a workflow_call run, which is what
    # keeps a standalone run from cancelling the one a release build is waiting on.
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint with ruff
        run: ruff check --output-format=github .
      - name: Check formatting
        run: ruff format --check .

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12"]
        # The product only runs on Windows, so check one job there too: path
        # handling is the code most likely to differ between the two.
        include:
          - os: windows-latest
            python-version: "3.11"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      # requirements-dev.txt deliberately excludes pypresence, psutil, requests
      # and pyinstaller: the suite must pass without them, which is what keeps
      # the Windows-only runtime code out of the tested modules.
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Test with pytest
        run: pytest
